><path d="M149.66,152.96 L147.64,151.49" stroke="#000" stroke-width="0.3"/><path d="M148.03,155.41 L145.89,154.10" stroke="#000" stroke-width="0.3"/><path d="M146.59,157.98 L144.36,156.84" stroke="#000" stroke-width="0.3"/><path d="M147.66,161.61 L143.04,159.69" stroke="#000" stroke-width="0.3"/><path d="M144.34,163.41 L141.96,162.64" stroke="#000" stroke-width="0.3"/><path d="M143.54,166.25 L141.11,165.66" stroke="#000" stroke-width="0.3"/><path d="M142.96,169.13 L140.49,168.74" stroke="#000" stroke-width="0.3"/><path d="M142.62,172.06 L140.12,171.86" stroke="#000" stroke-width="0.3"/><path d="M145.00,175.00 L140.00,175.00" stroke="#000" stroke-width="0.3"/><path d="M180.00,175.00 L180.00,135.00" stroke="#000" stroke-width="0.45"/><text x="180.00" y="132.20" font-size="3" text-anchor="middle">0% shut</text><path d="M180.00,175.00 L164.69,138.04" stroke="#000" stroke-width="0.2"/><text x="163.16" y="135.55" font-size="3" text-anchor="end">25%</text><path d="M180.00,175.00 L151.72,146.72" stroke="#000" stroke-width="0.2"/><text x="148.89" y="145.09" font-size="3" text-anchor="end">50%</text><path d="M180.00,175.00 L144.36,156.84" stroke="#000" stroke-width="0.2"/><text x="140.80" y="155.02" font-size="3" text-anchor="end">70%</text><path d="M180.00,175.00 L143.04,159.69" stroke="#000" stroke-width="0.2"/><text x="139.35" y="160.56" font-size="3" text-anchor="end">75%</text><path d="M180.00,175.00 L140.00,175.00" stroke="#000" stroke-width="0.45"/><text x="136.00" y="176.20" font-size="3" text-anchor="end">100% open</text><path d="M180,135 A40,40 0 0 0 140,175" fill="none" stroke="#000" stroke-width="0.3"/><circle cx="180" cy="175" r="3" fill="none" stroke="#000" stroke-width="0.3"/><path d="M175,175 h10 M180,170 v10" stroke="#000" stroke-width="0.2"/><text x="150" y="180.5" font-size="2.6" text-anchor="middle">along the pipe</text><text x="10" y="236" font-size="3.1">Position % = handle angle from shut ÷ 90°: 25% = 22.5°, 50% = 45°, 70% = 63°, 75% = 67.5°, 100% = 90°.</text><text x="10" y="242" font-size="3.1">1. Cut out the dial and the centre hole, slide it over the stem under the handle, and tape it flat.</text><text x="10" y="248" font-size="3.1">2. Turn the handle fully shut and fully open: it must stop on the 0% and 100% lines. If not, rotate the dial.</text><text x="10" y="254" font-size="3.1">3. Line up the centre line of the handle with each mark. Sequence (sheet 06): 100, 75, 70, 50, 25, then back up</text><text x="10" y="260" font-size="3.1">    50, 75, 100; the way back up shows hysteresis. After each move type MARK V75 (etc.) and hold 60 s.</text><text x="10" y="266" font-size="3.1">4. The paper's text says 75% and its table says 70%: record both.</text></g></svg>