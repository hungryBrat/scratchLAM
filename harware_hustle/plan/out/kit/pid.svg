<text x="396" y="672" class="io" text-anchor="start">I-2</text>
<text x="460" y="672" class="t" text-anchor="start">P-03 only into running P-01, SOV-01 closed</text>
<text x="396" y="691" class="io" text-anchor="start">I-3</text>
<text x="460" y="691" class="t" text-anchor="start">SOV-01 held closed while P-03 runs</text>
<text x="396" y="710" class="io" text-anchor="start">I-4</text>
<text x="460" y="710" class="t" text-anchor="start">P-02 trip: dry run or blocked discharge</text>
<text x="396" y="729" class="io" text-anchor="start">HS-01</text>
<text x="460" y="729" class="t" text-anchor="start">start / stop switch on G34</text>
<text x="850" y="636" class="tb" text-anchor="start">NOTES</text>
<text x="850" y="655" class="t" text-anchor="start">1  Dip tubes enter from the top; only LS-01 pierces a wall.</text>
<text x="850" y="674" class="t" text-anchor="start">2  FT-01 after BV-02: never sees the 8.25 bar cut-off.</text>
<text x="850" y="693" class="t" text-anchor="start">   (FT-01 rated 0.8 MPa)</text>
<text x="850" y="712" class="t" text-anchor="start">3  TK-01, TK-03 raised ~0.3 m: flooded pump suction.</text>
<text x="850" y="731" class="t" text-anchor="start">4  8×5 PU lines; 10×8 PU stubs at pump ports.</text>
<text x="850" y="750" class="t" text-anchor="start">5  BV-02 is the throttling (needle) valve: the kit has none.</text>
